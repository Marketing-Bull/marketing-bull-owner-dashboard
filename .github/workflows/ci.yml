name: CI

on:
  # `stable` is the only long-lived branch: work lands on it through pull
  # requests, and the live host runs it. There is no `preview` integration
  # branch any more, and `main` is retired. Pull requests are covered
  # separately below, whatever their target.
  push:
    branches: ["stable"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # node:sqlite (src/lib/dashboard-state.ts) needs >= 22.5.
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # The timezone suite sets TZ per case, so it exercises America/New_York,
      # Europe/Berlin and friends even though the runner itself is UTC. Running
      # only in the runner's zone would not catch the UTC-vs-local day bug.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build
